name: Tests

on:
  push:
    branches: [main]

jobs:
  Tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: bash tests/run-tests-in-parallel.sh

  Release:
    needs: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create bundle
        run: |
          tar --create --gzip \
            --exclude="tests" \
            --exclude="CLAUDE.md" \
            --exclude="LICENSE.md" \
            --file ~/lit.tar.gz *

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes || true
          gh release create latest ~/lit.tar.gz \
            --title "Latest" \
            --notes "Latest build from main branch (commit ${{ github.sha }})" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
