  Release:
    # needs: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create bundle
        run: |
          tar --create --gzip \
            --exclude="tests/*" \
            --exclude="CLAUDE.md" \
            --exclude="LICENSE.md" \
            --file ~/lit.tar.gz *

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          gh release create latest ~/lit.tar.gz \
            --title "Latest" \
            --notes "Latest build from main branch (commit ${{ github.sha }})" \
            --prerelease
