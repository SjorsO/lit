name: Tests

on:
  push:
    branches: [main]

jobs:
  Tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          true # bash tests/run-tests-in-parallel.sh

  Create-Release-Bundle:
    needs: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create bundle
        run: |
          tar --create --gzip \
            --exclude="tests" \
            --exclude="CLAUDE.md" \
            --exclude="LICENSE.md" \
            --file ~/lit.tar.gz *

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes || true
          gh release create latest ~/lit.tar.gz \
            --title "Latest" \
            --notes "Latest build from main branch (commit ${{ github.sha }})" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Push-Release-Branch:
    if: github.ref == 'refs/heads/main'
    needs: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Push to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin release:release 2>/dev/null || true

          if git rev-parse --verify release >/dev/null 2>&1; then
            git checkout release
            git merge --no-commit -s ours main
          else
            git checkout -b release
          fi

          git checkout main -- .
          rm -rf tests .github CLAUDE.md LICENSE.md
          git add -A

          if [ -z "$(git status --porcelain)" ]; then
            git merge --abort 2>/dev/null || true
            printf 'No changes to release branch\n'
            exit 0
          fi

          git commit -m "Release from main@${GITHUB_SHA::11}"
          git push origin release
