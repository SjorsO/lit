name: Tests

on:
  push:
    branches: [main]

jobs:
  Tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          true # bash tests/run-tests-in-parallel.sh

  Create-Release-Bundle:
    needs: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create bundle
        run: |
          tar --create --gzip \
            --exclude="tests" \
            --exclude="CLAUDE.md" \
            --exclude="LICENSE.md" \
            --file ~/lit.tar.gz *

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes || true
          gh release create latest ~/lit.tar.gz \
            --title "Latest" \
            --notes "Latest build from main branch (commit ${{ github.sha }})" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Push-Release-Branch:
    if: github.ref == 'refs/heads/main'
    needs: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Push to release branch
        run: |
          git clone --branch release https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git ../release 2>/dev/null || \
            git clone https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git ../release && git -C ../release checkout --orphan release && git -C ../release rm -rf .

          cd ../release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} +
          cp -r "$GITHUB_WORKSPACE"/. .
          rm -rf tests .github CLAUDE.md LICENSE.md
          git add -A

          if [ -z "$(git status --porcelain)" ]; then
            printf 'No changes to release branch\n'
            exit 0
          fi

          git commit -m "Release from main@${GITHUB_SHA::11}"
          git push origin release
