name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          - os: macos-latest
            php-version: '8.5'

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Run tests
        run: php tests/run-tests.php

  Create-Release-Bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Create bundle
        run: |
          tar --create --gzip \
            --exclude="tests" \
            --exclude="LICENSE.md" \
            --file ~/lit.tar.gz *

      - name: Create release
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ~/lit.tar.gz \
            --title "Latest" \
            --notes "Latest build from main branch (commit ${{ github.sha }})" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Push-Release-Branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Push to release branch
        env:
          SSH_KEY: ${{ secrets.PRIVATE_SSH_KEY_FOR_RELEASE_BRANCH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key"

          git clone --branch release git@github.com:${{ github.repository }}.git ../release
          cd ../release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} +
          find "$GITHUB_WORKSPACE" -maxdepth 1 ! -name .git ! -name . ! -path "$GITHUB_WORKSPACE" -exec cp -r {} . \;
          rm -rf tests .github LICENSE.md .gitignore
          git add -A

          if [ -z "$(git status --porcelain)" ]; then
            printf 'No changes to release branch\n'
            exit 0
          fi

          git commit -m "Release from main@${GITHUB_SHA::11}"
          git push origin release
